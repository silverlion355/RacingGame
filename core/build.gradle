apply plugin: "java-library"

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    // 真实 glTF 模型加载（libGDX 1.12 官方不再内置 glTF，用 gdx-gltf 替代 fbx）
    // 注意：只依赖核心加载模块 gltf，避免聚合包把 desktop/ibl-composer（含 gdx 重复类与桌面 dll）拉进来引发 Duplicate class 冲突
    api "com.github.mgsx-dev.gdx-gltf:gltf:2.3.0"
}

sourceSets {
    main {
        java.srcDirs = ['src']
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
